spring.application.name=meeting-room-reservation
server.port=8081
spring.threads.virtual.enabled=true

# ---- 어느 프로필로 띄울지 (실행할 때 덮어쓸 수 있어요) ----
spring.profiles.active=local

# ---- DB 연결 ----
# ⚠️ 비밀번호는 여기 쓰지 않아요. 환경 변수에서 읽어요
spring.datasource.url=jdbc:mysql://localhost:3307/meetingroom?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.config.import=optional:file:.env[.properties]